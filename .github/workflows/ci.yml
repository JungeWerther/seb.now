name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
        # Repository variables (the anon key isn't secret); a secret of the same
        # name is used when no variable is set.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno lint supabase/functions --ignore="$LINT_EXCLUDED"
        env:
          LINT_EXCLUDED: supabase/functions/activitypub,supabase/functions/mcp,supabase/functions/techcrunch-ingest
      - run: deno test supabase/functions/_shared

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The compiled scripts are committed (the DO build has no Node), so they
      # have to match their sources.
      - name: Compiled scripts are up to date
        run: git diff --exit-code -- '../src/seb_now/templates/*.js' && test -z "$(git status --porcelain -- ../src/seb_now/templates)"
      - run: npm test

  # The follow browser extension (extension/): one build for Chrome and Firefox,
  # desktop and Android. Firefox's own linter checks the manifest; the e2e test
  # drives the built popup in Chromium. The unpacked build is uploaded as an
  # artifact, and on main, when AMO API credentials are set, a signed unlisted
  # .xpi for Firefox (Android needs a signed one).
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      # The e2e test renders seb.now/connect with site.py's own code.
      - uses: astral-sh/setup-uv@v4
      - run: npm run e2e
      - run: npm run build && npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: seb-follow-extension
          path: extension/artifacts/*.zip
      - name: Sign for Firefox (unlisted)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.AMO_JWT_ISSUER != ''
        run: npx web-ext sign --source-dir dist --artifacts-dir artifacts --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.AMO_JWT_ISSUER != ''
        uses: actions/upload-artifact@v4
        with:
          name: seb-follow-firefox
          path: extension/artifacts/*.xpi

  # Migrations tested on Supabase's own Postgres image (pg_jsonschema, the
  # anon/authenticated roles), each in a fresh database shaped like production.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.168
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv run pytest -q tests/db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # The database deploys from the `migrations` branch, the frontend from main
  # (DigitalOcean deploys main on push). Land a schema change on `migrations`
  # first, then merge it into main, so a page never ships ahead of its schema.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/migrations'
    needs: [test, edge-functions, frontend, db]
    runs-on: ubuntu-latest
    concurrency: database
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run --no-project --with "psycopg[binary]" python scripts/migrate.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_CONNECTION_STRING }}

  # src/seb_now/db_types.py is generated from the database's schema, so it has
  # to match it. On `migrations` it runs once the migrate job has applied the
  # branch's files; anywhere the database is behind the repo it checks nothing.
  db-types:
    needs: [migrate]
    if: ${{ !cancelled() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Skip without the database secret
        if: env.SUPABASE_DB_URL == ''
        run: echo "::notice title=db-types::SUPABASE_CONNECTION_STRING isn't available, so the types aren't checked"
      - if: env.SUPABASE_DB_URL != ''
        run: uv run --no-project --with "psycopg[binary]" python scripts/gen_db_types.py
      - name: Generated types match the database
        if: env.SUPABASE_DB_URL != ''
        run: git diff --exit-code -- src/seb_now/db_types.py
