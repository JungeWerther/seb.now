name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run pytest -q
        # Repository variables (the anon key isn't secret); a secret of the same
        # name is used when no variable is set.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/entity-extract/index.ts supabase/functions/event-extract/index.ts supabase/functions/index-snapshot/index.ts supabase/functions/ical-ingest/index.ts supabase/functions/place-resolve/index.ts
      - run: deno test supabase/functions/_shared

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The compiled script is committed (the DO build has no Node), so it has
      # to match its source.
      - name: Compiled script is up to date
        run: git diff --exit-code -- ../src/seb_now/templates/filter.js
      - run: npm test

  # Migrations tested on Supabase's own Postgres image (pg_jsonschema, the
  # anon/authenticated roles), each in a fresh database shaped like production.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.168
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv run pytest -q tests/db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # The database deploys from the `migrations` branch, the frontend from main
  # (DigitalOcean deploys main on push). Land a schema change on `migrations`
  # first, then merge it into main, so a page never ships ahead of its schema.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/migrations'
    needs: [test, edge-functions, frontend, db]
    runs-on: ubuntu-latest
    concurrency: database
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run --no-project --with "psycopg[binary]" python scripts/migrate.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_CONNECTION_STRING }}
