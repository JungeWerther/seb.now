name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run pytest -q
        # Repository variables (the anon key isn't secret); a secret of the same
        # name is used when no variable is set.
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/entity-extract/index.ts supabase/functions/event-extract/index.ts supabase/functions/index-snapshot/index.ts
      - run: deno test supabase/functions/_shared

  # On main only, after both test jobs: apply new migrations, then deploy the
  # frontend, so a page never ships ahead of the schema it needs. DigitalOcean's
  # own deploy-on-push must be off, or it races the migration.
  migrate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, edge-functions]
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run --no-project --with "psycopg[binary]" python scripts/migrate.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl apps create-deployment "${{ vars.DO_APP_ID }}" --wait
