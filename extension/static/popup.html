<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Follow on seb.now</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Follow on seb.now</h1>
    <p id="page" class="page"></p>
    <button id="follow" class="primary" type="button">Follow</button>
    <button id="open" type="button">Just open in Claude</button>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="hint">Follow sends this page's feed and profile links (never its text) to your seb.now inbox, then opens Claude with <code>/follow</code>.</p>
    <a id="options" href="options.html">Options</a>
  </main>
  <script src="popup.js"></script>
</body>
</html>
