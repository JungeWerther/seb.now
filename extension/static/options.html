<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>seb.now follow: options</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wide">
    <h1>seb.now follow</h1>
    <p id="state" class="status" role="status" aria-live="polite"></p>
    <button id="connect" class="primary" type="button">Connect seb.now</button>
    <button id="disconnect" type="button" hidden>Disconnect this browser</button>
    <p class="hint">Connect opens seb.now in this browser, which links the extension to your seb.now account there. A new account needs approving once; the page shows its pairing code.</p>
    <a id="manage" href="https://seb.now/connect" target="_blank" rel="noopener">Manage connected devices</a>
  </main>
  <script src="options.js"></script>
</body>
</html>
