<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>seb.now</title>
  <style>
    :root {
      color-scheme: light dark;
      --positive: #4c9a6a;
      --positive-soft: #e1f3e6;
      --negative: #c96a6a;
      --negative-soft: #f8e6e6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --positive: #7fc999;
        --positive-soft: #203a29;
        --negative: #e0a0a0;
        --negative-soft: #3a2323;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
    h1 { font-size: 1.5rem; margin: 0; }
    #settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      padding: 0.25rem;
      color: inherit;
      opacity: 0.7;
    }
    #settings-btn:hover { opacity: 1; }
    #settings-panel {
      display: none;
      border: 1px solid rgba(128, 128, 128, 0.35);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 2rem;
    }
    #settings-panel.open { display: block; }
    #settings-panel label { display: block; font-size: 0.8rem; color: gray; margin-bottom: 0.3rem; }
    #settings-panel input {
      font: inherit;
      padding: 0.4rem 0.5rem;
      width: 100%;
      max-width: 260px;
      box-sizing: border-box;
      border: 1px solid rgba(128, 128, 128, 0.5);
      border-radius: 4px;
      background: transparent;
      color: inherit;
    }
    #settings-panel .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    #settings-panel button.save {
      font: inherit;
      padding: 0.4rem 0.8rem;
      border: 1px solid currentColor;
      border-radius: 4px;
      background: none;
      color: inherit;
      cursor: pointer;
    }
    #settings-status { font-size: 0.8rem; color: gray; }
    section.source-group { margin-bottom: 2rem; }
    section.source-group h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: gray;
      border-bottom: 1px solid currentColor;
      padding-bottom: 0.25rem;
      margin-bottom: 0.5rem;
    }
    ul.articles { list-style: none; padding: 0; margin: 0; }
    li.article {
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(128, 128, 128, 0.25);
      touch-action: pan-y;
    }
    li.article.upvoted { box-shadow: inset 3px 0 0 var(--positive); }
    .swipe-bg { position: absolute; inset: 0; }
    .swipe-bg .tint {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.1s;
    }
    .swipe-bg .tint-down { background: var(--negative-soft); }
    .swipe-bg .tint-up { background: var(--positive-soft); }
    .swipe-content {
      position: relative;
      background: Canvas;
      padding: 0.6rem 0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .swipe-content a { flex: 1; text-decoration: none; color: inherit; }
    .swipe-content a:hover { text-decoration: underline; }
    .swipe-content .score {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: gray;
      min-width: 1.5em;
      text-align: right;
    }
    .swipe-content .score.positive { color: var(--positive); }
    .swipe-content .score.negative { color: var(--negative); }
    .swipe-content .cluster { font-size: 0.75rem; color: gray; margin-left: 0.5rem; }
    #toast-container {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
      z-index: 1000;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: #2d2d2d;
      color: #f2f2f2;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-size: 0.85rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      animation: toast-in 0.2s ease-out;
    }
    .toast.leaving { animation: toast-out 0.2s ease-in forwards; }
    .toast .undo {
      background: none;
      border: none;
      color: #8ab4f8;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    @keyframes toast-in {
      from { transform: translateY(120%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes toast-out {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(120%); opacity: 0; }
    }
  </style>
</head>
<body>
  <header>
    <button id="settings-btn" aria-label="Settings">&#9881;</button>
    <h1>seb.now</h1>
  </header>
  <div id="toast-container"></div>
  <div id="settings-panel">
    <label for="handle-input">Your handle</label>
    <div class="row">
      <input id="handle-input" type="text" placeholder="pick a handle" maxlength="40">
      <button class="save" id="handle-save">Save</button>
      <span id="settings-status"></span>
    </div>
  </div>
  <!--ARTICLES-->
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(__SUPABASE_URL__, __SUPABASE_ANON_KEY__);
    const SWIPE_COMMIT_THRESHOLD_PX = 90;

    async function ensureSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) return session;
      const { data, error } = await supabase.auth.signInAnonymously();
      if (error) {
        console.error("anonymous sign-in failed", error);
        return null;
      }
      return data.session;
    }

    async function loadScores(linkIds) {
      const { data, error } = await supabase.from("votes").select("link_id, value").in("link_id", linkIds);
      if (error) {
        console.error("failed to load votes", error);
        return {};
      }
      const scores = {};
      for (const row of data) scores[row.link_id] = (scores[row.link_id] || 0) + row.value;
      return scores;
    }

    async function loadOwnVotes(linkIds, userId) {
      const { data, error } = await supabase
        .from("votes")
        .select("link_id, value")
        .eq("voter_id", userId)
        .in("link_id", linkIds);
      if (error) {
        console.error("failed to load own votes", error);
        return {};
      }
      const own = {};
      for (const row of data) own[row.link_id] = row.value;
      return own;
    }

    async function castVote(session, linkId, value) {
      if (!session) return;
      const { error } = await supabase
        .from("votes")
        .upsert({ link_id: linkId, voter_id: session.user.id, value }, { onConflict: "link_id,voter_id" });
      if (error) console.error("vote failed", error);
    }

    async function removeVote(session, linkId) {
      if (!session) return;
      const { error } = await supabase.from("votes").delete().eq("link_id", linkId).eq("voter_id", session.user.id);
      if (error) console.error("undo failed", error);
    }

    const TOAST_DURATION_MS = 3000;

    function showUndoToast(li, session, linkId) {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = '<span>Removed</span><button type="button" class="undo">Undo</button>';
      container.appendChild(toast);

      let settled = false;
      function dismiss() {
        toast.classList.add("leaving");
        setTimeout(() => toast.remove(), 200);
      }

      const timer = setTimeout(() => {
        settled = true;
        dismiss();
      }, TOAST_DURATION_MS);

      toast.querySelector(".undo").addEventListener("click", async () => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        await removeVote(session, linkId);
        li.style.transition = "max-height 0.2s ease-out, opacity 0.2s ease-out";
        li.style.maxHeight = "";
        li.style.opacity = "";
        li.classList.remove("upvoted");
        const content = li.querySelector(".swipe-content");
        content.style.transition = "transform 0.2s ease-out";
        content.style.transform = "translateX(0)";
        const scores = await loadScores([linkId]);
        renderScore(li, scores[linkId] || 0);
        dismiss();
      });
    }

    function renderScore(li, score) {
      const badge = li.querySelector(".score");
      badge.textContent = score > 0 ? `+${score}` : String(score);
      badge.classList.toggle("positive", score > 0);
      badge.classList.toggle("negative", score < 0);
    }

    function setupSwipe(li, session) {
      const content = li.querySelector(".swipe-content");
      const tintDown = li.querySelector(".tint-down");
      const tintUp = li.querySelector(".tint-up");
      const linkId = li.dataset.linkId;

      let startX = null;
      let dx = 0;
      let dragging = false;

      function reset() {
        content.style.transition = "transform 0.2s";
        content.style.transform = "translateX(0)";
        tintDown.style.opacity = 0;
        tintUp.style.opacity = 0;
      }

      function onDown(e) {
        startX = e.clientX;
        dragging = true;
        content.style.transition = "none";
        li.setPointerCapture(e.pointerId);
      }

      function onMove(e) {
        if (!dragging || startX === null) return;
        dx = e.clientX - startX;
        content.style.transform = `translateX(${dx}px)`;
        const progress = Math.min(Math.abs(dx) / SWIPE_COMMIT_THRESHOLD_PX, 1);
        if (dx < 0) {
          // left = upvote
          tintUp.style.opacity = progress;
          tintDown.style.opacity = 0;
        } else {
          // right = downvote + hide
          tintDown.style.opacity = progress;
          tintUp.style.opacity = 0;
        }
      }

      async function onUp() {
        if (!dragging) return;
        dragging = false;

        if (dx >= SWIPE_COMMIT_THRESHOLD_PX) {
          // right = downvote + hide
          content.style.transition = "transform 0.2s ease-in";
          content.style.transform = "translateX(120%)";
          await castVote(session, linkId, -1);
          li.style.transition = "max-height 0.2s ease-in, opacity 0.2s ease-in";
          li.style.maxHeight = li.offsetHeight + "px";
          requestAnimationFrame(() => {
            li.style.maxHeight = "0px";
            li.style.opacity = "0";
          });
          showUndoToast(li, session, linkId);
        } else if (dx <= -SWIPE_COMMIT_THRESHOLD_PX) {
          // left = upvote
          reset();
          li.classList.add("upvoted");
          await castVote(session, linkId, 1);
          const scores = await loadScores([linkId]);
          renderScore(li, scores[linkId] || 0);
        } else {
          reset();
        }
        dx = 0;
        startX = null;
      }

      li.addEventListener("pointerdown", onDown);
      li.addEventListener("pointermove", onMove);
      li.addEventListener("pointerup", onUp);
      li.addEventListener("pointercancel", () => {
        dragging = false;
        dx = 0;
        startX = null;
        reset();
      });
    }

    async function setupVoting() {
      const items = [...document.querySelectorAll("li.article")];
      if (items.length === 0) return;

      const session = await ensureSession();
      if (session) {
        const linkIds = items.map((li) => li.dataset.linkId);
        const own = await loadOwnVotes(linkIds, session.user.id);
        for (const li of items) {
          const value = own[li.dataset.linkId];
          if (value === -1) {
            li.remove();
          } else if (value === 1) {
            li.classList.add("upvoted");
          }
        }
      }

      const visible = [...document.querySelectorAll("li.article")];
      const visibleIds = visible.map((li) => li.dataset.linkId);
      if (visibleIds.length > 0) {
        const scores = await loadScores(visibleIds);
        for (const li of visible) renderScore(li, scores[li.dataset.linkId] || 0);
      }

      for (const li of visible) setupSwipe(li, session);
    }

    async function setupSettings() {
      const btn = document.getElementById("settings-btn");
      const panel = document.getElementById("settings-panel");
      const input = document.getElementById("handle-input");
      const saveBtn = document.getElementById("handle-save");
      const status = document.getElementById("settings-status");

      btn.addEventListener("click", async () => {
        panel.classList.toggle("open");
        if (panel.classList.contains("open")) {
          const session = await ensureSession();
          if (session) {
            const { data } = await supabase.from("profiles").select("handle").eq("id", session.user.id).single();
            input.value = data?.handle ?? "";
          }
        }
      });

      saveBtn.addEventListener("click", async () => {
        const session = await ensureSession();
        if (!session) return;
        status.textContent = "saving...";
        const { error } = await supabase
          .from("profiles")
          .update({ handle: input.value.trim() || null })
          .eq("id", session.user.id);
        status.textContent = error ? "failed to save" : "saved";
        setTimeout(() => (status.textContent = ""), 2000);
      });
    }

    setupVoting();
    setupSettings();
  </script>
</body>
</html>
