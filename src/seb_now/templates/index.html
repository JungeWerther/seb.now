<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>seb.now</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --post-bg: #f6f6f6;
      --positive: #4c9a6a;
      --positive-soft: #e1f3e6;
      --negative: #c96a6a;
      --negative-soft: #f8e6e6;
      --sheen: rgba(255, 255, 255, 0.5);
      /* The header's icon glyph (15px square) sits one gutter from the top,
         bottom and left edges. The feed's favicon column shares its centre,
         so the page itself is inset by the gutter less half the size
         difference between favicon and glyph. */
      --gutter: 25px;
      --favicon-size: 26px;
      --header-icon-glyph: 15px;
      --header-icon-inset: 2.5px;
      --header-height: calc(2 * var(--gutter) + var(--header-icon-glyph));
      --page-pad: calc(var(--gutter) - (var(--favicon-size) - var(--header-icon-glyph)) / 2);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --fg: #e8e8e8;
        --post-bg: #000000;
        --positive: #7fc999;
        --positive-soft: #203a29;
        --negative: #e0a0a0;
        --negative-soft: #3a2323;
        --sheen: rgba(255, 255, 255, 0.07);
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: calc(720px + var(--favicon-size) - var(--header-icon-glyph));
      margin: 0 auto;
      padding: calc(var(--header-height) + 1.5rem) var(--page-pad) 6rem;
      line-height: 1.5;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-height);
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid rgba(128, 128, 128, 0.12);
      will-change: transform;
    }
    .header-inner {
      max-width: calc(720px + 2 * var(--gutter));
      height: 100%;
      margin: 0 auto;
      padding: 0 var(--gutter);
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #search-dock {
      position: fixed;
      left: 0;
      right: 0;
      bottom: -40px;
      z-index: 15;
      display: flex;
      justify-content: center;
      padding: 1.75rem var(--gutter) calc(1.25rem + env(safe-area-inset-bottom) + 40px);
      background: linear-gradient(to top, var(--bg) 45%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      pointer-events: none;
      will-change: transform;
    }
    #search-bar { position: relative; width: 100%; max-width: 480px; pointer-events: auto; }
    #search-input {
      width: 100%;
      box-sizing: border-box;
      font: inherit;
      padding: 0.8rem 2.7rem 0.8rem 1.2rem;
      border: 1px solid var(--positive);
      border-radius: 999px;
      background: var(--bg);
      color: inherit;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
    }
    #search-input:focus {
      outline: none;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18), 0 0 0 3px var(--positive-soft);
    }
    #search-input::placeholder { color: gray; }
    #search-input::-webkit-search-cancel-button { display: none; }
    #search-clear {
      display: none;
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      align-items: center;
      justify-content: center;
      width: 1.6rem;
      height: 1.6rem;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(128, 128, 128, 0.18);
      color: gray;
      cursor: pointer;
    }
    #search-clear:hover { background: rgba(128, 128, 128, 0.3); color: var(--fg); }
    #search-clear.visible { display: flex; }
    #search-bar[hidden], #reply-composer[hidden] { display: none; }
    #reply-composer {
      position: relative;
      width: 100%;
      max-width: 480px;
      pointer-events: auto;
      box-sizing: border-box;
      padding: 0.55rem 0.55rem 0.55rem 1.1rem;
      border: 1px solid var(--positive);
      border-radius: 22px;
      background: var(--bg);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.18);
    }
    #reply-context {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding-right: 2rem;
      font-size: 0.7rem;
      color: gray;
      white-space: nowrap;
      overflow: hidden;
    }
    #reply-context-title { overflow: hidden; text-overflow: ellipsis; color: var(--fg); opacity: 0.75; }
    #reply-cancel {
      position: absolute;
      top: 0.45rem;
      right: 0.55rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(128, 128, 128, 0.18);
      color: gray;
      cursor: pointer;
    }
    .composer-row { display: flex; align-items: flex-end; gap: 0.5rem; margin-top: 0.3rem; }
    #reply-input {
      flex: 1;
      min-width: 0;
      max-height: 30vh;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: 1.4;
      padding: 0.3rem 0;
    }
    #reply-input::placeholder { color: gray; }
    #reply-send {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.2rem;
      height: 2.2rem;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: var(--positive);
      color: var(--bg);
      cursor: pointer;
    }
    #reply-send:disabled { opacity: 0.4; cursor: default; }
    #reply-remaining { font-size: 0.7rem; color: gray; align-self: center; }
    #reply-remaining.over { color: var(--negative); }
    #search-empty {
      display: none;
      color: gray;
      font-size: 0.85rem;
      text-align: center;
      padding: 2.5rem 0;
    }
    #search-empty.visible { display: block; }
    h1.brand { margin: 0; line-height: 0; }
    h1.brand .wordmark { height: 26px; width: auto; display: block; }
    #settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      padding: 0;
      margin-left: calc(-1 * var(--header-icon-inset));
      color: inherit;
      opacity: 0.7;
    }
    #settings-btn:hover { opacity: 1; }
    #settings-panel {
      display: none;
      border: 1px solid rgba(128, 128, 128, 0.35);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 2rem;
    }
    #settings-panel.open { display: block; }
    #settings-panel label { display: block; font-size: 0.8rem; color: gray; margin-bottom: 0.3rem; }
    #settings-panel input {
      font: inherit;
      padding: 0.4rem 0.5rem;
      width: 100%;
      max-width: 260px;
      box-sizing: border-box;
      border: 1px solid rgba(128, 128, 128, 0.5);
      border-radius: 4px;
      background: transparent;
      color: inherit;
    }
    #settings-panel .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    #settings-panel button.save {
      font: inherit;
      padding: 0.4rem 0.8rem;
      border: 1px solid currentColor;
      border-radius: 4px;
      background: none;
      color: inherit;
      cursor: pointer;
    }
    #settings-status { font-size: 0.8rem; color: gray; }
    ul.articles { list-style: none; padding: 0; margin: 0; }
    li.article {
      --card-gap: 0.7rem;
      --domain-line-height: 1.05rem;
      position: relative;
      overflow: hidden;
    }
    li.article.dragging { overflow: visible; z-index: 5; }
    li.article.dragging .post-swipe { overflow: visible; }
    li.article.dragging .post { box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); will-change: transform; }
    li.article.upvoted { box-shadow: inset 3px 0 0 var(--positive); }
    .post-swipe {
      --post-pad-x: calc(0.75rem + 1px);
      position: relative;
      overflow: hidden;
      margin: calc(0.3rem + 6px) 0 0 calc(-1 * var(--post-pad-x));
      border-radius: 14px;
      touch-action: pan-y;
    }
    html.swiping { overscroll-behavior: none; }
    .swipe-bg { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
    .swipe-bg .tint {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.1s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0 1.1rem;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .swipe-bg .tint svg { flex-shrink: 0; }
    .swipe-bg .tint > svg,
    .swipe-bg .tint > span {
      opacity: 0.55;
      transform: scale(0.9);
      transition: opacity 0.15s, transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1);
    }
    .swipe-bg .tint.armed > svg,
    .swipe-bg .tint.armed > span { opacity: 1; transform: scale(1); }
    /* One soft light band sweeping across the tint the moment a drag crosses the vote threshold. */
    .swipe-bg .tint::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 30%, var(--sheen) 50%, transparent 70%);
      transform: translateX(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .swipe-bg .tint-down.armed::after { animation: sheen-right 0.6s ease-out; }
    .swipe-bg .tint-up.armed::after { animation: sheen-left 0.6s ease-out; }
    @keyframes sheen-right {
      from { transform: translateX(-100%); opacity: 1; }
      to { transform: translateX(100%); opacity: 1; }
    }
    @keyframes sheen-left {
      from { transform: translateX(100%); opacity: 1; }
      to { transform: translateX(-100%); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .swipe-bg .tint.armed::after { animation: none; }
    }
    .swipe-bg .tint-down { background: var(--negative-soft); color: var(--negative); justify-content: flex-start; }
    .swipe-bg .tint-up { background: var(--positive-soft); color: var(--positive); justify-content: flex-end; }
    .swipe-content {
      position: relative;
      background: var(--bg);
      padding: 0.6rem 0 1.4rem;
      display: flex;
      align-items: flex-start;
      gap: var(--card-gap);
    }
    .swipe-content .favicon {
      position: relative;
      flex: 0 0 var(--favicon-size);
      height: var(--favicon-size);
      border-radius: 50%;
      background: rgba(128, 128, 128, 0.18);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 0.72rem;
      font-weight: 600;
      color: gray;
    }
    .swipe-content .favicon::before { content: attr(data-letter); position: absolute; }
    .swipe-content .favicon img {
      position: relative;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: var(--bg);
    }
    .swipe-content .card-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .post.flash-positive { animation: flash-positive 0.9s ease-out; }
    @keyframes flash-positive {
      from { background-color: var(--positive-soft); }
      to { background-color: var(--post-bg); }
    }
    .swipe-content::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(128, 128, 128, 0.25);
    }
    .swipe-content .post {
      position: relative;
      padding: calc(0.6rem + 1px) var(--post-pad-x);
      border-radius: 14px;
      background: var(--post-bg);
    }
    .swipe-content .post-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .swipe-content .reply-count { font-size: 0.75rem; color: gray; font-variant-numeric: tabular-nums; }
    .swipe-content .reply-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      border: 1px solid rgba(128, 128, 128, 0.35);
      border-radius: 50%;
      background: var(--bg);
      color: gray;
      cursor: pointer;
    }
    .swipe-content .reply-btn:hover { color: var(--fg); border-color: rgba(128, 128, 128, 0.6); }
    li.article.replying .reply-btn { color: var(--positive); border-color: var(--positive); }
    .swipe-content .replies {
      list-style: none;
      margin: 0.5rem 0 0;
      padding: 0 0 0 0.75rem;
      border-left: 2px solid rgba(128, 128, 128, 0.2);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .swipe-content .replies[hidden] { display: none; }
    .reply-author { display: block; font-size: 0.7rem; color: gray; }
    .reply-body { margin: 0; font-size: 0.9rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .swipe-content .cover-link { display: block; margin: 0.6rem 0 0; }
    .swipe-content .cover {
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 180px;
      object-fit: cover;
      border-radius: 9px;
      display: block;
      -webkit-user-drag: none;
    }
    .swipe-content .meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: calc((var(--favicon-size) - var(--domain-line-height)) / 2);
    }
    .swipe-content .domain {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.7rem;
      line-height: var(--domain-line-height);
      color: gray;
      text-align: left;
    }
    .article-row { display: flex; align-items: center; gap: 0.6rem; }
    .article-row a { flex: 1; min-width: 0; overflow-wrap: anywhere; text-decoration: none; color: inherit; }
    .article-row a:hover { text-decoration: underline; }
    .article-row a.visited { color: gray; }
    .article-row .score {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: gray;
      min-width: 1.5em;
      text-align: right;
    }
    .article-row .score.positive { color: var(--positive); }
    .article-row .score.negative { color: var(--negative); }
    .meta .topics {
      display: flex;
      gap: 0.25rem;
      flex-shrink: 0;
    }
    .meta .topic {
      font-size: 0.65rem;
      line-height: 1.4;
      padding: 0 0.45rem;
      border: 1px solid rgba(128, 128, 128, 0.35);
      border-radius: 999px;
      color: gray;
      white-space: nowrap;
    }
    #toast-container {
      position: fixed;
      bottom: 6.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: center;
      z-index: 1000;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: #2d2d2d;
      color: #f2f2f2;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-size: 0.85rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      animation: toast-in 0.2s ease-out;
    }
    .toast.leaving { animation: toast-out 0.2s ease-in forwards; }
    .toast .undo {
      background: none;
      border: none;
      color: #8ab4f8;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }
    @keyframes toast-in {
      from { transform: translateY(120%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes toast-out {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(120%); opacity: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <button id="settings-btn" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <path d="M9 3v18"/>
          <path d="m14 9 3 3-3 3"/>
        </svg>
      </button>
      <h1 class="brand">
        <svg class="wordmark" viewBox="0 0 172 34" role="img" aria-label="seb.now" xmlns="http://www.w3.org/2000/svg">
          <text x="172" y="25" text-anchor="end" font-family="'Bricolage Grotesque', sans-serif" font-size="27" font-weight="700">
            <tspan fill="var(--fg)">seb</tspan><tspan fill="var(--positive)"><animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>.</tspan><tspan fill="var(--fg)" font-weight="400" opacity="0.85">now</tspan>
          </text>
        </svg>
      </h1>
    </div>
  </header>
  <div id="toast-container"></div>
  <div id="settings-panel">
    <label for="handle-input">Your handle</label>
    <div class="row">
      <input id="handle-input" type="text" placeholder="pick a handle" maxlength="40">
      <button class="save" id="handle-save">Save</button>
      <span id="settings-status"></span>
    </div>
  </div>
  <p id="search-empty">No matching articles.</p>
  <!--ARTICLES-->
  <div id="search-dock">
    <div id="search-bar">
      <input id="search-input" type="search" placeholder="Filter articles…" aria-label="Filter articles" autocomplete="off">
      <button type="button" id="search-clear" aria-label="Clear search">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
    <div id="reply-composer" hidden>
      <div id="reply-context"><span>Replying to</span><span id="reply-context-title"></span></div>
      <div class="composer-row">
        <textarea id="reply-input" rows="1" placeholder="Write a reply…" aria-label="Write a reply"></textarea>
        <span id="reply-remaining" hidden></span>
        <button type="button" id="reply-send" aria-label="Send reply" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m5 12 7-7 7 7"/>
            <path d="M12 19V5"/>
          </svg>
        </button>
      </div>
      <button type="button" id="reply-cancel" aria-label="Cancel reply">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
  </div>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(__SUPABASE_URL__, __SUPABASE_ANON_KEY__);
    const SWIPE_COMMIT_THRESHOLD_PX = 110;
    const SWIPE_CAPTURE_SLOP_PX = 6;
    // Steepest upward heading a gesture may start with and still become a swipe.
    const SWIPE_START_MAX_UP_DEG = 15;
    // How long after crossing SWIPE_CAPTURE_SLOP_PX the card waits before
    // it starts following, so the gesture's heading can settle first.
    const SWIPE_START_DECIDE_MS = 100;
    // Momentum time constant for a feed scroll the page drives itself.
    const SCROLL_FLING_DECAY_MS = 325;
    const SCROLL_FLING_MIN_SPEED = 0.02; // px/ms
    const SCROLL_FLING_IDLE_MS = 60;
    const SWIPE_PIVOT_DISTANCE_PX = 600;
    const SWIPE_MAX_ANGLE_DEG = 35;
    const SWIPE_RADIAL_SLACK_PX = 30;
    const SWIPE_SETTLE_MS = 280;
    const SWIPE_FLY_MS = 220;
    // Time constant of the card's exponential follow toward the finger.
    const SWIPE_SMOOTHING_MS = 35;
    // Tint opacity just short of the threshold; crossing it jumps to full.
    const SWIPE_TINT_PREVIEW_OPACITY = 0.55;
    const SWIPE_ARMED_VIBRATE_MS = 8;

    async function ensureSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) return session;
      const { data, error } = await supabase.auth.signInAnonymously();
      if (error) {
        console.error("anonymous sign-in failed", error);
        return null;
      }
      return data.session;
    }

    async function loadScores(linkIds) {
      const { data, error } = await supabase.from("votes").select("link_id, value").in("link_id", linkIds);
      if (error) {
        console.error("failed to load votes", error);
        return {};
      }
      const scores = {};
      for (const row of data) scores[row.link_id] = (scores[row.link_id] || 0) + row.value;
      return scores;
    }

    async function loadOwnVotes(linkIds, userId) {
      const { data, error } = await supabase
        .from("votes")
        .select("link_id, value")
        .eq("voter_id", userId)
        .in("link_id", linkIds);
      if (error) {
        console.error("failed to load own votes", error);
        return {};
      }
      const own = {};
      for (const row of data) own[row.link_id] = row.value;
      return own;
    }

    async function loadVisited(linkIds, userId) {
      const { data, error } = await supabase
        .from("link_visits")
        .select("link_id")
        .eq("visitor_id", userId)
        .in("link_id", linkIds);
      if (error) {
        console.error("failed to load visited links", error);
        return new Set();
      }
      return new Set(data.map((row) => row.link_id));
    }

    async function markVisited(session, linkId) {
      if (!session) return;
      const { error } = await supabase
        .from("link_visits")
        .upsert(
          { link_id: linkId, visitor_id: session.user.id },
          { onConflict: "link_id,visitor_id", ignoreDuplicates: true },
        );
      if (error) console.error("mark visited failed", error);
    }

    async function castVote(session, linkId, value) {
      if (!session) return;
      const { error } = await supabase
        .from("votes")
        .upsert({ link_id: linkId, voter_id: session.user.id, value }, { onConflict: "link_id,voter_id" });
      if (error) console.error("vote failed", error);
    }

    async function removeVote(session, linkId) {
      if (!session) return;
      const { error } = await supabase.from("votes").delete().eq("link_id", linkId).eq("voter_id", session.user.id);
      if (error) console.error("undo failed", error);
    }

    const TOAST_DURATION_MS = 3000;

    function showToast(message) {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = "toast";
      const text = document.createElement("span");
      text.textContent = message;
      toast.appendChild(text);
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add("leaving");
        toast.addEventListener("animationend", () => toast.remove(), { once: true });
      }, TOAST_DURATION_MS);
    }

    function showUndoToast(li, session, linkId) {
      const container = document.getElementById("toast-container");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.innerHTML = '<span>Removed</span><button type="button" class="undo">Undo</button>';
      container.appendChild(toast);

      let settled = false;
      function dismiss() {
        toast.classList.add("leaving");
        setTimeout(() => toast.remove(), 200);
      }

      const timer = setTimeout(() => {
        settled = true;
        dismiss();
      }, TOAST_DURATION_MS);

      toast.querySelector(".undo").addEventListener("click", async () => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        await removeVote(session, linkId);
        li.style.transition = "max-height 0.2s ease-out, opacity 0.2s ease-out";
        li.style.maxHeight = "";
        li.style.opacity = "";
        li.classList.remove("upvoted");
        const content = li.querySelector(".post");
        content.style.transition = "transform 0.2s ease-out, opacity 0.2s ease-out";
        content.style.transform = "";
        content.style.opacity = "";
        for (const tint of li.querySelectorAll(".tint")) {
          tint.style.opacity = 0;
          tint.classList.remove("armed");
        }
        const scores = await loadScores([linkId]);
        renderScore(li, scores[linkId] || 0);
        dismiss();
      });
    }

    function renderScore(li, score) {
      const badge = li.querySelector(".score");
      badge.textContent = score > 0 ? `+${score}` : String(score);
      badge.classList.toggle("positive", score > 0);
      badge.classList.toggle("negative", score < 0);
    }

    // The post swings like a card hanging from a pivot SWIPE_PIVOT_DISTANCE_PX
    // below its centre, confined to an arc-shaped band: the finger's
    // horizontal travel alone sets the angle around that pivot (clamped to
    // +/- SWIPE_MAX_ANGLE_DEG), and its vertical travel alone sets the radius
    // (clamped to the pivot distance +/- SWIPE_RADIAL_SLACK_PX). Keeping the
    // axes separate means dragging far down only presses the card against
    // the band's edge - it never adds tilt, flips the angle, or reaches the
    // vote threshold the way an angle measured from the finger's position
    // relative to the pivot would once the finger approaches the pivot.
    // A sideways-leaning gesture that turns out to be a feed scroll gets no
    // native scrolling (touch-action: pan-y already gave it to the page
    // script), so the page scrolls itself, with momentum on release.
    let flingFrame = null;
    function stopFling() {
      if (flingFrame !== null) cancelAnimationFrame(flingFrame);
      flingFrame = null;
    }
    function flingScroll(velocity) {
      stopFling();
      let last = null;
      const step = (now) => {
        const dt = last === null ? 16 : now - last;
        last = now;
        window.scrollBy(0, velocity * dt);
        velocity *= Math.exp(-dt / SCROLL_FLING_DECAY_MS);
        flingFrame = Math.abs(velocity) < SCROLL_FLING_MIN_SPEED ? null : requestAnimationFrame(step);
      };
      flingFrame = requestAnimationFrame(step);
    }
    window.addEventListener("pointerdown", stopFling, { capture: true });

    function setupSwipe(li, session) {
      const area = li.querySelector(".post-swipe");
      const content = area.querySelector(".post");
      const tintDown = li.querySelector(".tint-down");
      const tintUp = li.querySelector(".tint-up");
      const linkId = li.dataset.linkId;
      const maxAngle = (SWIPE_MAX_ANGLE_DEG * Math.PI) / 180;
      const maxStartUpSlope = Math.tan((SWIPE_START_MAX_UP_DEG * Math.PI) / 180);

      let startX = null;
      let startY = null;
      let slopAt = null;
      let claimed = false;
      // Scroll mode: this gesture is the feed being scrolled by the page.
      let scrolling = false;
      let lastY = 0;
      let lastMoveAt = 0;
      let velocity = 0;
      let dragging = false;
      // Where the finger is (target) vs. where the card is drawn (shown);
      // pointer events only move the target, and one rAF loop eases the card
      // toward it, so bursty/uneven event delivery can't make it jitter.
      const target = { dx: 0, dy: 0 };
      const shown = { dx: 0, dy: 0 };
      let frame = null;
      let lastFrameAt = null;

      function arcPosition(dx, dy) {
        const R = SWIPE_PIVOT_DISTANCE_PX;
        const angle = Math.max(-maxAngle, Math.min(maxAngle, Math.atan2(dx, R)));
        const radius = Math.max(R - SWIPE_RADIAL_SLACK_PX, Math.min(R + SWIPE_RADIAL_SLACK_PX, R - dy));
        return { x: radius * Math.sin(angle), y: R - radius * Math.cos(angle), angle };
      }

      function draw() {
        const { x, y, angle } = arcPosition(shown.dx, shown.dy);
        content.style.transform = `translate(${x}px, ${y}px) rotate(${angle}rad)`;
        setTints(x, arcPosition(target.dx, target.dy).x);
      }

      function tick(now) {
        const dt = lastFrameAt === null ? 16 : now - lastFrameAt;
        lastFrameAt = now;
        const follow = 1 - Math.exp(-dt / SWIPE_SMOOTHING_MS);
        shown.dx += (target.dx - shown.dx) * follow;
        shown.dy += (target.dy - shown.dy) * follow;
        draw();
        frame = dragging ? requestAnimationFrame(tick) : null;
      }

      function stopFollowing() {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        lastFrameAt = null;
        target.dx = target.dy = shown.dx = shown.dy = 0;
      }

      // Opacity follows the drawn card; the armed state follows the finger,
      // because that is what onUp decides the vote from.
      function setTints(x, targetX) {
        const progress = Math.min(Math.abs(x) / SWIPE_COMMIT_THRESHOLD_PX, 1) * SWIPE_TINT_PREVIEW_OPACITY;
        const upArmed = targetX <= -SWIPE_COMMIT_THRESHOLD_PX; // left = upvote
        const downArmed = targetX >= SWIPE_COMMIT_THRESHOLD_PX; // right = downvote + hide
        tintUp.style.opacity = upArmed ? 1 : x < 0 ? progress : 0;
        tintDown.style.opacity = downArmed ? 1 : x > 0 ? progress : 0;
        setArmed(tintUp, upArmed);
        setArmed(tintDown, downArmed);
      }

      function setArmed(tint, armed) {
        if (tint.classList.contains("armed") === armed) return;
        tint.classList.toggle("armed", armed);
        if (armed) navigator.vibrate?.(SWIPE_ARMED_VIBRATE_MS);
      }

      // Claimed: past the slop and heading sideways, i.e. pending or dragging.
      // From then on the browser must not scroll, overscroll or
      // pull-to-refresh with the gesture.
      function setClaimed(value) {
        claimed = value;
        document.documentElement.classList.toggle("swiping", value);
      }

      function endDrag() {
        setClaimed(false);
        dragging = false;
        startX = null;
        startY = null;
        stopFollowing();
      }

      function reset() {
        content.style.transition = `transform ${SWIPE_SETTLE_MS}ms cubic-bezier(0.2, 0.9, 0.3, 1.15)`;
        content.style.transform = "";
        tintDown.style.opacity = 0;
        tintUp.style.opacity = 0;
        setArmed(tintDown, false);
        setArmed(tintUp, false);
        const settle = () => li.classList.remove("dragging");
        content.addEventListener("transitionend", settle, { once: true });
        setTimeout(settle, SWIPE_SETTLE_MS + 50);
      }

      function onDown(e) {
        if (e.target.closest("button")) return;
        startX = e.clientX;
        startY = e.clientY;
        slopAt = null;
        scrolling = false;
        dragging = true;
        content.style.transition = "none";
      }

      // Capturing on pointerdown would retarget a plain tap's click to the
      // swipe area, so links/buttons inside never receive it - capture only
      // once the pointer has actually moved far enough to be a swipe.
      // An unclaimed vertical-dominant gesture is already the browser's pan
      // (it sends pointercancel); a sideways-leaning one, or one whose
      // earlier moves were claimed, gets no native scroll and is scrolled here.
      function startScroll(e, dx, dy) {
        const browserScrolls = !claimed && Math.abs(dy) > Math.abs(dx);
        dragging = false;
        startX = null;
        startY = null;
        setClaimed(false);
        if (e.pointerType !== "touch" || browserScrolls) return;
        scrolling = true;
        window.scrollBy(0, -dy);
        lastY = e.clientY;
        lastMoveAt = e.timeStamp;
        velocity = 0;
      }

      function followScroll(e) {
        const delta = lastY - e.clientY;
        const dt = Math.max(1, e.timeStamp - lastMoveAt);
        window.scrollBy(0, delta);
        velocity = 0.8 * (delta / dt) + 0.2 * velocity;
        lastY = e.clientY;
        lastMoveAt = e.timeStamp;
      }

      function endScroll(e, fling) {
        scrolling = false;
        if (fling && e.timeStamp - lastMoveAt < SCROLL_FLING_IDLE_MS) flingScroll(velocity);
      }

      function onMove(e) {
        if (scrolling) {
          followScroll(e);
          return;
        }
        if (!dragging || startX === null) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        if (!area.hasPointerCapture(e.pointerId)) {
          if (Math.hypot(dx, dy) < SWIPE_CAPTURE_SLOP_PX) return;
          // Heading upward (or mostly vertical) when crossing the slop, or
          // once the decide delay has passed, means the feed is being
          // scrolled: the card never starts moving.
          const scrollish = Math.abs(dy) > Math.abs(dx) || -dy > Math.abs(dx) * maxStartUpSlope;
          if (slopAt === null) slopAt = e.timeStamp;
          if (scrollish) {
            startScroll(e, dx, dy);
            return;
          }
          if (!claimed) setClaimed(true);
          if (e.timeStamp - slopAt < SWIPE_START_DECIDE_MS) return;
          area.setPointerCapture(e.pointerId);
          li.classList.add("dragging");
        }
        target.dx = dx;
        target.dy = dy;
        if (frame === null) frame = requestAnimationFrame(tick);
      }

      async function onUp(e) {
        if (scrolling) {
          endScroll(e, true);
          return;
        }
        if (!dragging) return;
        const { x } = arcPosition(target.dx, target.dy);
        endDrag();

        if (x <= -SWIPE_COMMIT_THRESHOLD_PX) {
          // left = upvote
          reset();
          li.classList.add("upvoted");
          content.classList.add("flash-positive");
          content.addEventListener("animationend", () => content.classList.remove("flash-positive"), { once: true });
          await castVote(session, linkId, 1);
          const scores = await loadScores([linkId]);
          renderScore(li, scores[linkId] || 0);
        } else if (x >= SWIPE_COMMIT_THRESHOLD_PX) {
          // right = downvote + hide: carry on along the arc and off-screen
          content.style.transition = `transform ${SWIPE_FLY_MS}ms ease-in, opacity ${SWIPE_FLY_MS}ms ease-in`;
          content.style.transform = `translate(${window.innerWidth}px, ${SWIPE_PIVOT_DISTANCE_PX * (1 - Math.cos(maxAngle))}px) rotate(${maxAngle}rad)`;
          content.style.opacity = "0";
          await castVote(session, linkId, -1);
          li.classList.remove("dragging");
          li.style.transition = "max-height 0.2s ease-in, opacity 0.2s ease-in";
          li.style.maxHeight = li.offsetHeight + "px";
          requestAnimationFrame(() => {
            li.style.maxHeight = "0px";
            li.style.opacity = "0";
          });
          showUndoToast(li, session, linkId);
        } else {
          reset();
        }
      }

      area.addEventListener("pointerdown", onDown);
      area.addEventListener("pointermove", onMove);
      // Once a swipe is claimed (including the decide delay before the card
      // moves), keep the browser from turning the rest of the gesture into a
      // page scroll or pull-to-refresh, however steeply the finger then moves
      // down. Vertical/upward starts are never claimed, so they still scroll.
      area.addEventListener(
        "touchmove",
        (e) => {
          if ((claimed || scrolling) && e.cancelable) e.preventDefault();
        },
        { passive: false },
      );
      area.addEventListener("pointerup", onUp);
      area.addEventListener("pointercancel", (e) => {
        if (scrolling) endScroll(e, false);
        endDrag();
        reset();
      });
    }

    async function setupVoting() {
      const items = [...document.querySelectorAll("li.article")];
      if (items.length === 0) return;

      const session = await ensureSession();
      if (session) {
        const linkIds = items.map((li) => li.dataset.linkId);
        const own = await loadOwnVotes(linkIds, session.user.id);
        for (const li of items) {
          const value = own[li.dataset.linkId];
          if (value === -1) {
            li.remove();
          } else if (value === 1) {
            li.classList.add("upvoted");
          }
        }
      }

      const visible = [...document.querySelectorAll("li.article")];
      const visibleIds = visible.map((li) => li.dataset.linkId);
      if (visibleIds.length > 0) {
        const scores = await loadScores(visibleIds);
        for (const li of visible) renderScore(li, scores[li.dataset.linkId] || 0);
      }

      if (session && visibleIds.length > 0) {
        const visited = await loadVisited(visibleIds, session.user.id);
        for (const li of visible) {
          const link = li.querySelector(".article-row a");
          const linkId = li.dataset.linkId;
          if (visited.has(linkId)) link.classList.add("visited");
          const onOpen = () => {
            link.classList.add("visited");
            markVisited(session, linkId);
          };
          link.addEventListener("click", onOpen);
          li.querySelector(".cover-link")?.addEventListener("click", onOpen);
        }
      }

      for (const li of visible) setupSwipe(li, session);
    }

    async function setupSettings() {
      const btn = document.getElementById("settings-btn");
      const panel = document.getElementById("settings-panel");
      const input = document.getElementById("handle-input");
      const saveBtn = document.getElementById("handle-save");
      const status = document.getElementById("settings-status");

      btn.addEventListener("click", async () => {
        panel.classList.toggle("open");
        if (panel.classList.contains("open")) {
          const session = await ensureSession();
          if (session) {
            const { data } = await supabase.from("profiles").select("handle").eq("id", session.user.id).single();
            input.value = data?.handle ?? "";
          }
        }
      });

      saveBtn.addEventListener("click", async () => {
        const session = await ensureSession();
        if (!session) return;
        status.textContent = "saving...";
        const { error } = await supabase
          .from("profiles")
          .update({ handle: input.value.trim() || null })
          .eq("id", session.user.id);
        status.textContent = error ? "failed to save" : "saved";
        setTimeout(() => (status.textContent = ""), 2000);
      });
    }

    // Must match the replies_body_length check in the replies migration.
    const REPLY_MAX_LENGTH = 500;
    const REPLY_REMAINING_WARN_AT = 50;
    const REPLY_SELECT = "id, link_id, body, created_at, profiles(handle)";

    // Reply bodies are untrusted user text: they only ever reach the DOM
    // through textContent, never innerHTML, so markup in them stays inert.
    function renderReply(li, reply) {
      const list = li.querySelector(".replies");
      const item = document.createElement("li");
      item.className = "reply";
      const author = document.createElement("span");
      author.className = "reply-author";
      author.textContent = reply.profiles?.handle || "anonymous";
      const body = document.createElement("p");
      body.className = "reply-body";
      body.textContent = reply.body;
      item.append(author, body);
      list.appendChild(item);
      list.hidden = false;
    }

    function setReplyCount(li, count) {
      const badge = li.querySelector(".reply-count");
      badge.textContent = String(count);
      badge.hidden = count === 0;
      li.dataset.replyCount = String(count);
    }

    async function loadReplies(items) {
      const byId = new Map(items.map((li) => [li.dataset.linkId, li]));
      if (byId.size === 0) return;
      const { data, error } = await supabase
        .from("replies")
        .select(REPLY_SELECT)
        .in("link_id", [...byId.keys()])
        .order("created_at");
      if (error) {
        console.error("failed to load replies", error);
        return;
      }
      const counts = new Map();
      for (const reply of data) {
        const li = byId.get(reply.link_id);
        if (!li) continue;
        renderReply(li, reply);
        counts.set(li, (counts.get(li) || 0) + 1);
      }
      for (const [li, count] of counts) setReplyCount(li, count);
    }

    function setupReplies() {
      const searchBar = document.getElementById("search-bar");
      const composer = document.getElementById("reply-composer");
      const contextTitle = document.getElementById("reply-context-title");
      const input = document.getElementById("reply-input");
      const sendBtn = document.getElementById("reply-send");
      const cancelBtn = document.getElementById("reply-cancel");
      const remaining = document.getElementById("reply-remaining");
      let target = null;
      let sending = false;

      function autoGrow() {
        input.style.height = "auto";
        input.style.height = `${input.scrollHeight}px`;
      }

      function refresh() {
        const length = input.value.trim().length;
        const left = REPLY_MAX_LENGTH - input.value.length;
        remaining.hidden = left > REPLY_REMAINING_WARN_AT;
        remaining.textContent = String(left);
        remaining.classList.toggle("over", left < 0);
        sendBtn.disabled = sending || length === 0 || left < 0;
        autoGrow();
      }

      function open(li) {
        if (target && target !== li) target.classList.remove("replying");
        target = li;
        li.classList.add("replying");
        contextTitle.textContent = li.querySelector(".article-row a")?.textContent ?? "";
        searchBar.hidden = true;
        composer.hidden = false;
        refresh();
        input.focus();
      }

      function close() {
        target?.classList.remove("replying");
        target = null;
        input.value = "";
        composer.hidden = true;
        searchBar.hidden = false;
        input.blur();
      }

      async function send() {
        const body = input.value.trim();
        if (!target || sending || !body || input.value.length > REPLY_MAX_LENGTH) return;
        sending = true;
        refresh();
        const li = target;
        const session = await ensureSession();
        if (!session) {
          sending = false;
          refresh();
          showToast("Couldn't sign you in to reply");
          return;
        }
        const { data, error } = await supabase
          .from("replies")
          .insert({ link_id: li.dataset.linkId, author_id: session.user.id, body })
          .select(REPLY_SELECT)
          .single();
        sending = false;
        if (error) {
          console.error("reply failed", error);
          refresh();
          showToast("Couldn't post your reply");
          return;
        }
        renderReply(li, data);
        setReplyCount(li, Number(li.dataset.replyCount || 0) + 1);
        close();
        showToast("Reply posted");
      }

      for (const li of document.querySelectorAll("li.article")) {
        li.querySelector(".reply-btn")?.addEventListener("click", (e) => {
          e.stopPropagation();
          if (target === li) close();
          else open(li);
        });
      }
      input.addEventListener("input", refresh);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Escape") close();
        else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          send();
        }
      });
      sendBtn.addEventListener("click", send);
      cancelBtn.addEventListener("click", close);

      loadReplies([...document.querySelectorAll("li.article")]);
    }

    const SEARCH_QUERY_STORAGE_KEY = "seb-now-search-query";

    function setupSearch() {
      const input = document.getElementById("search-input");
      const empty = document.getElementById("search-empty");
      const clearBtn = document.getElementById("search-clear");

      function applyFilter() {
        const query = input.value.trim().toLowerCase();
        const items = [...document.querySelectorAll("li.article")];
        let visibleCount = 0;

        for (const li of items) {
          const title = li.querySelector(".article-row a")?.textContent ?? "";
          const domain = li.querySelector(".domain")?.textContent ?? "";
          const matches = !query || `${title} ${domain}`.toLowerCase().includes(query);
          li.style.display = matches ? "" : "none";
          if (matches) visibleCount++;
        }

        empty.classList.toggle("visible", query.length > 0 && visibleCount === 0);
        clearBtn.classList.toggle("visible", input.value.length > 0);
      }

      input.addEventListener("input", () => {
        try {
          if (input.value) localStorage.setItem(SEARCH_QUERY_STORAGE_KEY, input.value);
          else localStorage.removeItem(SEARCH_QUERY_STORAGE_KEY);
        } catch {
          // private browsing / storage disabled - filtering still works, just isn't remembered
        }
        applyFilter();
      });

      clearBtn.addEventListener("click", () => {
        input.value = "";
        try {
          localStorage.removeItem(SEARCH_QUERY_STORAGE_KEY);
        } catch {
          // ignore
        }
        applyFilter();
        input.focus();
      });

      try {
        const savedQuery = localStorage.getItem(SEARCH_QUERY_STORAGE_KEY);
        if (savedQuery) input.value = savedQuery;
      } catch {
        // ignore - nothing to restore
      }
      applyFilter();
    }

    // iOS/Android nudge the whole layout viewport up to keep a focused
    // input clear of the on-screen keyboard - including position:fixed
    // elements, which are meant to stay put. The visualViewport API
    // reports the visible region separately from that shifted layout
    // viewport, so we counter-translate the header/dock by the gap
    // between them, keeping both pinned to what's actually on screen.
    function setupViewportPinning() {
      const vv = window.visualViewport;
      if (!vv) return;
      const header = document.querySelector("header");
      const dock = document.getElementById("search-dock");
      const input = document.getElementById("search-input");
      const replyInput = document.getElementById("reply-input");

      let scheduled = false;

      function apply() {
        scheduled = false;
        // Chrome on iOS fires visualViewport resize/scroll continuously
        // during ordinary page scrolling too (its own toolbar hides/shows,
        // unlike Safari) - only a focused dock field (search or reply)
        // means a keyboard is plausibly involved, so that's otherwise a no-op
        // rather than fighting normal scroll with a moving dock.
        if (!dock.contains(document.activeElement)) {
          header.style.transform = "";
          dock.style.transform = "";
          return;
        }
        header.style.transform = vv.offsetTop ? `translateY(${vv.offsetTop}px)` : "";
        const bottomGap = window.innerHeight - (vv.height + vv.offsetTop);
        dock.style.transform = bottomGap > 0 ? `translateY(${-bottomGap}px)` : "";
      }

      // Batch rapid-fire scroll/resize events into one style write per
      // frame - reading layout metrics and writing transforms on every
      // single event causes visible jank on iOS.
      function reposition() {
        if (scheduled) return;
        scheduled = true;
        requestAnimationFrame(apply);
      }

      vv.addEventListener("resize", reposition);
      vv.addEventListener("scroll", reposition);
      // Belt and suspenders: the keyboard-open/close animation can settle
      // after visualViewport's own events fire (timing varies by browser),
      // so also re-check shortly after focus/blur on the input itself.
      input.addEventListener("focus", () => setTimeout(reposition, 350));
      input.addEventListener("blur", () => setTimeout(reposition, 350));
      replyInput.addEventListener("focus", () => setTimeout(reposition, 350));
      replyInput.addEventListener("blur", () => setTimeout(reposition, 350));
    }

    setupVoting();
    setupSettings();
    setupSearch();
    setupReplies();
    setupViewportPinning();
  </script>
</body>
</html>
