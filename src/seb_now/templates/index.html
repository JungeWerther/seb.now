<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>seb.now</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #0b0b0c;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 3rem 1.5rem 1.5rem;
    text-align: center;
  }
  header h1 {
    font-size: 2rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.02em;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }
  .topic {
    border-top: 1px solid #232326;
    padding: 1.5rem 0;
  }
  .topic h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #9a9a9f;
    margin: 0 0 0.75rem;
  }
  .topic ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .topic li {
    padding: 0.4rem 0;
    font-size: 1.05rem;
  }
</style>
</head>
<body>
<header><h1>seb.now</h1></header>
<main>
{% for cluster in clusters %}
  <section class="topic">
    <h2>Topic {{ loop.index }}</h2>
    <ul>
    {% for headline in cluster.member_texts %}
      <li>{{ headline }}</li>
    {% endfor %}
    </ul>
  </section>
{% endfor %}
</main>
</body>
</html>
