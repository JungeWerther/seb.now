[project]
name = "seb-now"
version = "0.1.0"
description = "seb.now news website"
readme = "README.md"
authors = [
    { name = "seb", email = "info@seb.now" }
]
requires-python = ">=3.12"
dependencies = [
    "numba>=0.67.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
examples = [
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F", "ANN"]
